<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="css-3.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Caixa mágica</title>
</head>
<body>
   <h1>Caixa interativa &#x1F480; </h1>
   <p>Essa é a caixa que muda de cor passando e cricando com o mouse </p>
   <img src="00lo_ac30_210603.jpg " width="300px" alt="box">
   <br>
   <a href="https://www.youtube.com/watch?v=hzmuUbVQ8oQ&list=RDhzmuUbVQ8oQ&start_radio=1">blackcat</a>
   <div id = "area">
    Interaja aqui...
   </div>
<script>
    a = window.document.getElementById('area')
    a.addEventListener('click',clicar)
    a.addEventListener('mouseenter', entrar)
    a.addEventListener('mouseout',sair)
    function clicar() {
        a.innerText = 'Clicou!'
        a.style.background = 'red'
    }
    function entrar(){
        a.innerText = 'Entrou!'
        a.style.background = 'blue'
    }
    function sair(){
        a.innerText = 'Saiu!'
        a.style.background = 'yellow'
    }
</script>
</body>
</html>
